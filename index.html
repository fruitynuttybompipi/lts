<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Left to Spend</title>
<meta name="description" content="Personal finance tracker: how much more you can spend and how much to save.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <defs>

    <symbol id="c-transport" viewBox="0 0 24 24"><path d="M4 16v-3l2-6h12l2 6v3zM4 13h16M6 16v3M18 16v3M7.5 14.5h.01M16.5 14.5h.01"/></symbol>

    <symbol id="c-bills" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

<main id="view"></main>
<nav class="tabs" aria-label="Main">
  <button data-act="tab" data-tab="today"><svg class="icon"><use href="#i-today"/></svg>Today</button>
  <button data-act="tab" data-tab="spending"><svg class="icon"><use href="#i-spending"/></svg>Spending</button>
  <button class="add" data-act="add" aria-label="Add entry"><svg class="icon"><use href="#i-add"/></svg></button>
  <button data-act="tab" data-tab="accounts"><svg class="icon"><use href="#i-accounts"/></svg>Accounts</button>
  <button data-act="tab" data-tab="plan"><svg class="icon"><use href="#i-plan"/></svg>Plan</button>
</nav>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
