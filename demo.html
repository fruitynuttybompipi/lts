@property --glow { syntax: "<color>"; inherits: true; initial-value: #1c2a4a; }

:root {
  --ground: #0b0d12;
  --surface: #1a1d25;
  --surface-up: #2a2e38;
  --line: #333845;
  --stroke: #7c7c80;
  --text: #fff;
  --text-soft: #b4b6be;
  --glow-calm: #1c2a4a;
  --glow-ok: #0f5a3a;
  --glow-fast: #6b5a00;
  --glow-over: #6e2413;
  --card-save: #1f6feb;
  --card-credit: #c9481f;
  --card-wallet: #12805a;
  --card-bank: #2a2e38;
  --link: #5aa2ff;
  --gain: #30d158;
  --alert: #ff7a5c;
  --caution: #ffd60a;
  --c-food: #d47a08;
  --c-groceries: #1a9c5e;
  --c-transport: #3f8cff;
  --c-shopping: #ee4a70;
  --c-bills: #b09000;
  --c-health: #16a3a0;
  --c-fun: #b565f0;
  --c-other: #c8693f;
  --scrim: rgb(0 0 0 / .6);
  --ui: Manrope, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --tabs: calc(64px + env(safe-area-inset-bottom));
  --s-1: 4px;
  --s-2: 8px;
  --s-3: 12px;
  --s-4: 16px;
  --s-5: 24px;
  --s-6: 32px;
  --r-card: 14px;
  --r-control: 10px;
  --t-tab: .6875rem;
  --t-meta: .875rem;
  --t-body: 1rem;
  --t-section: 1.25rem;
  --t-title: 2rem;
  --t-figure: 4.5rem;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--line) var(--ground); }
/* Lets the iPhone text size setting scale every rem. */
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }

.acct-balance, .row-amount, .sum-table td, .cat-label, .grow input {
  font-variant-numeric: tabular-nums;
}

body {
  margin: 0;
  --glow: var(--glow-calm);
  background: var(--ground);
  color: var(--text);
  font: 400 var(--t-body)/1.4 var(--ui);
  caret-color: var(--link);
}

/* The screen shows pace before any number is read. */
body[data-pace="ok"] { --glow: var(--glow-ok); }
body[data-pace="fast"] { --glow: var(--glow-fast); }
body[data-pace="over"] { --glow: var(--glow-over); }
body { transition: --glow .8s ease; }
body::before {
  content: "";
  position: fixed; inset: 0 0 auto; z-index: -1;
  height: 62vh;
  background: radial-gradient(120% 90% at 50% -14%, var(--glow), transparent 72%);
  pointer-events: none;
}

::selection { background: var(--text); color: var(--ground); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
h1, h2, p { margin: 0; }
h1, h2 { text-wrap: balance; }
p { text-wrap: pretty; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
legend { padding: 0; }
.sprite { position: absolute; }

.icon {
  width: 24px; height: 24px;
  flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.75;
  stroke-linecap: round; stroke-linejoin: round;
}

.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

<script type="module">
const mem=new Map();
Object.defineProperty(window,'localStorage',{value:{getItem:k=>mem.get(k)??null,setItem:(k,v)=>mem.set(k,String(v)),removeItem:k=>mem.delete(k)}});
const iso=n=>{const d=new Date();d.setDate(d.getDate()-n);const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const rm=n=>Math.round(n*100);
const cats=['Food','Groceries','Transport','Shopping','Bills','Health','Fun','Other'].map(n=>({id:'cat-'+n.toLowerCase(),name:n,updatedAt:0}));
const com=[['house-loan','House loan',1800,1],['car-loan','Car loan',900,5],['house-rental','House rental',400,3],['health-insurance','Health insurance',250,10],['subscriptions','Subscriptions',70,15],['instalments','Instalments',80,20]].map(([k,name,a,day])=>({id:'com-'+k,name,amount:rm(a),day,accountId:'bank',from:iso(60),to:null,addedOn:iso(60),updatedAt:1}));
const tx=[['cat-food',18.5,0,'card','Sample lunch'],['cat-transport',60,1,'tng',''],['cat-groceries',142.3,1,'card','Sample groceries'],['cat-fun',45,3,'tng','Sample cinema'],['cat-shopping',380,4,'card','Sample shopping'],['cat-food',156,5,'card','']].map(([categoryId,a,d,accountId,note],i)=>({id:'t'+i,type:'spend',categoryId,amount:rm(a),date:iso(d),accountId,note,updatedAt:i+1}));
mem.set('left-to-spend-data',JSON.stringify({meta:{payday:25,setupDate:iso(60),salaryAccountId:'bank',updatedAt:1},accounts:[{id:'bank',name:'Sample Bank',brand:'maybank',type:'bank',opening:rm(4200),addedOn:iso(6),archived:false,updatedAt:1},{id:'card',name:'Sample Card',brand:'cimb',type:'card',opening:-rm(320),addedOn:iso(6),archived:false,updatedAt:1},{id:'tng',name:'Sample E-wallet',brand:'tng',type:'ewallet',opening:rm(210),addedOn:iso(6),archived:false,updatedAt:1}],categories:cats,commitments:com,plans:[{id:'p',salary:rm(6000),savePct:null,from:iso(60),updatedAt:1}],tx,deleted:{},dismissed:{}}));
// Pure money logic. Amounts are integer sen; dates are local YYYY-MM-DD strings.

// randomUUID needs a secure context; the fallback keeps saving working in sandboxed previews.
const uid = () => crypto.randomUUID?.() ?? `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

const COLLECTIONS = ['accounts', 'commitments', 'categories', 'plans', 'tx'];
const START_PCT = 20;
const BUFFER_PCT = 10;
const FULL_CYCLES_NEEDED = 3;
const MAX_CUT_PCT = 25;

const pad = n => String(n).padStart(2, '0');
const toIso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const localToday = () => toIso(new Date());
const daysBetween = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);
const addDays = (iso, n) => new Date(utc(iso) + n * 864e5).toISOString().slice(0, 10);

// Clamps to month end, so payday 31 lands on 28 Feb.
function dayIn(year, month, day) {
  const first = new Date(year, month, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return toIso(new Date(first.getFullYear(), first.getMonth(), Math.min(day, last)));
}

function cycleOf(date, payday) {
  const [y, m] = date.split('-').map(Number);
  const here = dayIn(y, m - 1, payday);
  return date >= here
    ? { start: here, end: dayIn(y, m, payday) }
    : { start: dayIn(y, m - 2, payday), end: here };
}

const nextCycle = (cycle, payday) => cycleOf(cycle.end, payday);
const prevCycle = (cycle, payday) => cycleOf(addDays(cycle.start, -1), payday);

// Matching on the cycle end keeps history stable if payday later moves.
const activeIn = (items, cycle) =>
  items.filter(x => x.from < cycle.end && (!x.to || x.to >= cycle.end));

function planFor(data, cycle) {
  const fit = data.plans.filter(p => p.from < cycle.end).sort((a, b) => a.from.localeCompare(b.from));
  return fit.at(-1) ?? [...data.plans].sort((a, b) => a.from.localeCompare(b.from))[0];
}

const commitmentsIn = (data, cycle) => activeIn(data.commitments, cycle).filter(c => c.amount > 0);
const inCycle = (t, cycle) => t.date >= cycle.start && t.date < cycle.end;
const sum = (items, f = x => x.amount) => items.reduce((a, x) => a + f(x), 0);
const spentIn = (data, cycle) => sum(data.tx.filter(t => t.type === 'spend' && inCycle(t, cycle)));
const incomeIn = (data, cycle) => sum(data.tx.filter(t => t.type === 'income' && inCycle(t, cycle)));
const afterCommitments = (data, cycle) =>
  Math.max(0, planFor(data, cycle).salary - sum(commitmentsIn(data, cycle)));

function pastCycles(data, cycle) {
  const { payday, setupDate } = data.meta;
  const first = cycleOf(setupDate, payday).start;
  const out = [];
  for (let c = prevCycle(cycle, payday); c.start >= first; c = prevCycle(c, payday)) out.unshift(c);
  return out;
}

function spendByCategory(data, cycle) {
  const totals = new Map();
  for (const t of data.tx) {
    if (t.type === 'spend' && inCycle(t, cycle)) totals.set(t.categoryId, (totals.get(t.categoryId) ?? 0) + t.amount);
  }
  return [...totals].map(([id, amount]) => ({ id, amount })).sort((a, b) => b.amount - a.amount);
}

function overspendCauses(data, cycle) {
  const before = new Map(spendByCategory(data, prevCycle(cycle, data.meta.payday)).map(c => [c.id, c.amount]));
  return spendByCategory(data, cycle)
    .map(c => ({ id: c.id, rise: c.amount - (before.get(c.id) ?? 0) }))
    .sort((a, b) => b.rise - a.rise)
    .slice(0, 2)
    .filter(c => c.rise > 0)
    .map(c => c.id);
}

function suggestedSavings(data, cycle) {
  const left = afterCommitments(data, cycle);
  const plan = planFor(data, cycle);
  if (plan.savePct != null) {
    return { amount: Math.round(left * plan.savePct / 100), basis: 'fixed', pct: plan.savePct, over: 0, lowered: 0, causes: [] };
  }
  const past = pastCycles(data, cycle);
  const full = past.filter(c => c.start >= data.meta.setupDate).slice(-FULL_CYCLES_NEEDED);
  let amount, basis, average = 0;
  if (full.length < FULL_CYCLES_NEEDED) {
    amount = Math.round(left * START_PCT / 100);
    basis = 'start';
  } else {
    average = Math.round(sum(full, c => spentIn(data, c)) / full.length);
    amount = Math.max(0, left - average - Math.round(left * BUFFER_PCT / 100));
    amount -= amount % 1000;
    basis = 'average';
  }
  const last = past.at(-1);
  const over = last ? Math.max(0, spentIn(data, last) - spendingBudget(data, last)) : 0;
  let lowered = 0;
  if (over) {
    lowered = Math.min(over, Math.ceil(amount * MAX_CUT_PCT / 100));
    lowered += (amount - lowered) % 1000;
    amount -= lowered;
  }
  return { amount, basis, pct: START_PCT, average, over, lowered, causes: over ? overspendCauses(data, last) : [] };
}

const spendingBudget = (data, cycle) =>
  afterCommitments(data, cycle) - suggestedSavings(data, cycle).amount + incomeIn(data, cycle);

// Compares share of budget spent with share of the cycle gone.
function pace(spent, budget, today, cycle) {
  const spentPct = budget > 0 ? (spent / budget) * 100 : 100;
  const dayPct = (daysBetween(cycle.start, today) / daysBetween(cycle.start, cycle.end)) * 100;
  const state = spent > budget ? 'over' : spentPct > dayPct + 10 ? 'fast' : 'ok';
  return { spentPct: Math.min(100, spentPct), dayPct, state };
}

function summary(data, today) {
  const cycle = cycleOf(today, data.meta.payday);
  const plan = planFor(data, cycle);
  const commitments = sum(commitmentsIn(data, cycle));
  const savings = suggestedSavings(data, cycle);
  const income = incomeIn(data, cycle);
  const spent = spentIn(data, cycle);
  const budget = spendingBudget(data, cycle);
  const left = budget - spent;
  const days = daysBetween(today, cycle.end);
  const prior = prevCycle(cycle, data.meta.payday);
  // A partial first cycle or an unlogged cycle says nothing true about what was left.
  const hasPrior = prior.start >= data.meta.setupDate && spentIn(data, prior) > 0;
  return {
    cycle, salary: plan.salary, commitments, afterCommitments: plan.salary - commitments,
    savings, income, budget, spent, left, days,
    pace: pace(spent, budget, today, cycle),
    leftover: hasPrior ? Math.max(0, spendingBudget(data, prior) - spentIn(data, prior)) : 0,
    prior: hasPrior ? prior : null,
  };
}

function cycleReport(data, cycle) {
  return {
    cycle, spent: spentIn(data, cycle), budget: spendingBudget(data, cycle),
    commitments: sum(commitmentsIn(data, cycle)), categories: spendByCategory(data, cycle),
  };
}

function dueIn(cycle, day) {
  const [y, m] = cycle.start.split('-').map(Number);
  const here = dayIn(y, m - 1, day);
  return here >= cycle.start ? here : dayIn(y, m, day);
}

// Salary and commitments are derived, never stored, so editing them cannot duplicate entries.
function balances(data, today) {
  const accounts = new Map(data.accounts.map(a => [a.id, a]));
  const bal = new Map(data.accounts.map(a => [a.id, a.opening]));
  const add = (id, delta) => { if (bal.has(id)) bal.set(id, bal.get(id) + delta); };
  // The opening balance already reflects anything dated before the account was added.
  const logged = (id, delta, date) => { if (date >= accounts.get(id)?.addedOn) add(id, delta); };
  const scheduled = (id, delta, date, addedOn) => {
    const acct = accounts.get(id);
    if (acct && date > acct.addedOn && date > addedOn && date <= today) add(id, delta);
  };

  for (const t of data.tx) {
    if (t.type === 'spend') logged(t.accountId, -t.amount, t.date);
    if (t.type === 'income' || t.type === 'adjust') logged(t.accountId, t.amount, t.date);
    if (t.type === 'transfer') { logged(t.accountId, -t.amount, t.date); logged(t.toAccountId, t.amount, t.date); }
  }

  let unpaid = 0;
  if (data.plans.length) {
    const { payday, setupDate, salaryAccountId } = data.meta;
    const now = cycleOf(today, payday);
    for (let c = cycleOf(setupDate, payday); c.start <= now.start; c = nextCycle(c, payday)) {
      scheduled(salaryAccountId, planFor(data, c).salary, c.start, setupDate);
      for (const x of commitmentsIn(data, c)) {
        const due = dueIn(c, x.day);
        scheduled(x.accountId, -x.amount, due, x.addedOn);
        if (c.start === now.start && due > today && accounts.get(x.accountId)?.type === 'bank') unpaid += x.amount;
      }
    }
  }

  const owed = sum(data.accounts.filter(a => a.type === 'card'), a => Math.max(0, -bal.get(a.id)));
  return { balances: bal, owed, unpaid, spokenFor: owed + unpaid };
}

function savePlan(data, patch, today, now) {
  const cycle = cycleOf(today, data.meta.payday);
  const current = data.plans.find(p => p.from >= cycle.start);
  if (current) { Object.assign(current, patch, { updatedAt: now }); return; }
  const base = data.plans.length ? planFor(data, cycle) : { salary: 0, savePct: null };
  data.plans.push({ ...base, ...patch, id: uid(), from: cycle.start, updatedAt: now });
}

// Changes start at the current cycle; earlier cycles keep the old row.
function changeCommitment(data, id, patch, today, now) {
  const c = data.commitments.find(x => x.id === id);
  const start = cycleOf(today, data.meta.payday).start;
  if (!c.amount) {
    Object.assign(c, patch, { from: start, addedOn: today, updatedAt: now });
  } else if (c.from >= start) {
    Object.assign(c, patch, { updatedAt: now });
  } else {
    c.to = start;
    c.updatedAt = now;
    data.commitments.push({ ...c, ...patch, id: uid(), from: start, to: null, updatedAt: now });
  }
}

function endCommitment(data, id, today, now) {
  const c = data.commitments.find(x => x.id === id);
  const start = cycleOf(today, data.meta.payday).start;
  if (!c.amount || c.from >= start) {
    data.commitments = data.commitments.filter(x => x !== c);
    data.deleted[id] = now;
  } else {
    c.to = start;
    c.updatedAt = now;
  }
}

function correctBalance(data, accountId, target, today, now) {
  const current = balances(data, today).balances.get(accountId);
  if (target === current) return;
  data.tx.push({ id: uid(), type: 'adjust', accountId, amount: target - current, date: today, updatedAt: now });
}

// Newest edit of each item wins, and deletions beat edits made before them.
function merge(a, b) {
  const deleted = { ...a.deleted };
  for (const [id, at] of Object.entries(b.deleted ?? {})) deleted[id] = Math.max(deleted[id] ?? 0, at);
  const sorted = o => Object.fromEntries(Object.entries(o).sort(([x], [y]) => (x < y ? -1 : 1)));
  const out = {
    meta: (b.meta?.updatedAt ?? -1) > (a.meta?.updatedAt ?? -1) ? b.meta : a.meta,
    dismissed: sorted({ ...a.dismissed, ...b.dismissed }),
    deleted: sorted(deleted),
  };
  for (const key of COLLECTIONS) {
    const items = new Map();
    for (const x of [...(a[key] ?? []), ...(b[key] ?? [])]) {
      const seen = items.get(x.id);
      if (!seen || x.updatedAt > seen.updatedAt) items.set(x.id, x);
    }
    // Sorted so identical data serialises identically and sync can skip empty commits.
    out[key] = [...items.values()].filter(x => !(deleted[x.id] >= x.updatedAt)).sort((x, y) => (x.id < y.id ? -1 : 1));
  }
  return out;
}

function parseSen(text) {
  const clean = String(text).replace(/[,\s]/g, '').replace(/^RM/i, '');
  if (!/^\d*\.?\d{0,2}$/.test(clean) || !/\d/.test(clean)) return NaN;
  return Math.round(Number(clean) * 100);
}

function seed() {
  const cats = ['Food', 'Groceries', 'Transport', 'Shopping', 'Bills', 'Health', 'Fun', 'Other'];
  const regular = ['House loan', 'Car loan', 'House rental', 'Health insurance', 'Subscriptions', 'Instalments'];
  // Fixed ids, so two devices that start separately do not get duplicates when merged.
  return {
    meta: { payday: null, setupDate: null, salaryAccountId: null, updatedAt: 0 },
    accounts: [],
    categories: cats.map(name => ({ id: `cat-${slug(name)}`, name, updatedAt: 0 })),
    commitments: regular.map(name => ({
      id: `com-${slug(name)}`, name, amount: 0, day: 1, accountId: null, from: '', to: null, addedOn: '', updatedAt: 0,
    })),
    plans: [], tx: [], deleted: {}, dismissed: {},
  };
}

function load() {
  const raw = localStorage.getItem(KEY);
  if (!raw) return seed();
  try {
    return merge(seed(), JSON.parse(raw));
  } catch {
    localStorage.setItem(`${KEY}-damaged-${Date.now()}`, raw);
    return seed();
  }
}

  document.body.dataset.pace = ready && ui.tab === 'today' ? summary(data, localToday()).pace.state : 'calm';
  if (justReady) toast('Your wallet is ready');

    else b.removeAttribute('aria-current');
  });

/* The figure counts to its new value after an entry. */

const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = 'cubic-bezier(.16, 1, .3, 1)';

function count(el, from, to, format, ms = 800) {
  const final = el.textContent;
  const start = performance.now();
  const step = time => {
    if (!el.isConnected) return;
    const t = Math.min(1, (time - start) / ms);
    el.textContent = t < 1 ? format(from + (to - from) * (1 - (1 - t) ** 4)) : final;
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// Opening a screen fills its figure and bars from zero; values are already correct if motion is off.
function fillIn(again) {
  // Each screen fills once per app open, so daily tab switching stays instant.
  if (calm() || (!again && ui.seen.has(ui.tab))) return;
  ui.seen.add(ui.tab);
  const today = $('#figure');
  if (today) {
    const left = summary(data, localToday()).left;
    count(today, 0, left, figureText);
    const fill = $('.pace-fill');
    fill?.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 800, easing: EASE });
  }
  const spent = $('#spent');
  if (spent) count(spent, 0, Number(spent.dataset.sen), v => plain(Math.round(v)));
  document.querySelectorAll('.mix, .cat-bar').forEach((el, i) => el.animate(
    [{ transform: 'scaleX(0)' }, { transform: 'none' }],
    { duration: 700, delay: i * 30, easing: EASE, fill: 'backwards' },
  ));
}

function rollFigure(from, fromPct, accountId) {
  const el = $('#figure');
  if (!el || from == null || calm()) return;
  const now = summary(data, localToday());
  $('.pace-fill')?.animate([{ width: `${fromPct}%` }, { width: `${now.pace.spentPct}%` }], { duration: 800, easing: EASE });
  document.querySelector(`.acct[data-id="${CSS.escape(accountId)}"]`)?.animate(
    [{ transform: 'none' }, { transform: 'translateY(-8px)', offset: .35 }, { transform: 'none' }],
    { duration: 480, easing: EASE },
  );
  if (from !== now.left && (from < 0) === (now.left < 0)) count(el, from, now.left, figureText);
}

/* Toast */

let toastTimer;
const hideToast = () => $('#toast').classList.remove('show');

// An undo stays until the next action, so there is no time limit on recovering an entry.
function toast(text, undo) {
  const el = $('#toast');
  el.innerHTML = `<span class="toast-text">${svg('i-check')}${esc(text)}</span>${undo ? '<button>Undo</button>' : ''}`;
  if (undo) el.querySelector('button').onclick = () => { el.classList.remove('show'); undo(); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  if (!undo) toastTimer = setTimeout(hideToast, 2500);
}

const sheet = $('#sheet');

let sheetOpener = null;

function openSheet({ title, body, save, saveLabel = 'Save', focus, cancel = true }) {
  if (!sheet.open) sheetOpener = document.activeElement;
  sheet.innerHTML = `<form novalidate>
    <div class="sheet-head">
      ${cancel ? '<button type="button" data-close>Cancel</button>' : '<span></span>'}
      <h2 id="sheet-title">${esc(title)}</h2>
      <button type="button" class="save">${esc(saveLabel)}</button>
    </div>
    <div class="sheet-body"><p class="error" id="sheet-error" role="alert"></p>${body}</div>
  </form>`;
  const form = sheet.querySelector('form');
  const type = form.querySelector('[name="type"]:checked');
  if (type) form.dataset.type = type.value;
  form.addEventListener('change', e => { if (e.target.name === 'type') form.dataset.type = e.target.value; });
  // Saves on click, not form submit: sandboxed previews block submit without any error.
  const submit = () => {
    const problem = save(new FormData(form));
    form.querySelectorAll('[aria-invalid]').forEach(el => { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); });
    if (problem) {
      const [name, text] = problem;
      form.querySelector('.error').textContent = text;
      const field = form.elements[name];
      const target = field instanceof RadioNodeList ? field[0] : field;
      target.setAttribute('aria-invalid', 'true');
      target.setAttribute('aria-describedby', 'sheet-error');
      target.focus();
      sheet.scrollTop = 0;
    } else {
      sheet.close();
    }
  };
  form.querySelector('.save').addEventListener('click', submit);
  form.addEventListener('submit', e => { e.preventDefault(); submit(); });
  form.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.matches('input:not([type="radio"]):not([type="checkbox"])')) { e.preventDefault(); submit(); }
  });
  if (!sheet.open) sheet.showModal();
  if (focus) form.elements[focus].focus();
}

  }
  const body = `

    <div class="rows form-rows">
      <label class="grow">${plainTile('i-calendar')}<span>Date</span><input type="date" name="date" value="${t.date}"></label>
      <label class="grow not-transfer">${plainTile('i-note')}<span>Note</span><input name="note" autocomplete="off" placeholder="Optional" value="${esc(t.note)}"></label>
    </div>
    ${entry ? `<button type="button" class="btn danger" data-act="delete-entry" data-id="${esc(entry.id)}">${svg('i-trash')}Delete entry</button>` : ''}`;

  openSheet({
    title: entry ? 'Edit entry' : 'Add entry',
    focus: entry ? null : 'amount',
    body,
    save(f) {
      const type = f.get('type');
      const amount = parseSen(f.get('amount'));
      const date = f.get('date');
      if (!(amount > 0)) return ['amount', 'Enter an amount above zero, for example 12.50.'];
      if (type === 'spend' && !f.get('categoryId')) return ['categoryId', 'Choose a category.'];
      if (!f.get('accountId')) return ['accountId', 'Choose an account.'];
      if (type === 'transfer' && !f.get('toAccountId')) return ['toAccountId', 'Choose where the money moved to.'];
      if (type === 'transfer' && f.get('toAccountId') === f.get('accountId')) return ['toAccountId', 'Choose two different accounts.'];
      if (!date) return ['date', 'Choose a date.'];
      const fields = {
        type, amount, date, accountId: f.get('accountId'),
        categoryId: type === 'spend' ? f.get('categoryId') : null,
        toAccountId: type === 'transfer' ? f.get('toAccountId') : null,
        note: type === 'transfer' ? '' : f.get('note').trim(),
        updatedAt: Date.now(),
      };
      const prior = isReady() ? summary(data, localToday()) : null;
      if (entry) Object.assign(entry, fields);
      else data.tx.push({ id: uid(), ...fields });
      commit();
      if (ui.tab === 'today' && prior) rollFigure(prior.left, prior.pace.spentPct, fields.accountId);
      toast(entry ? 'Entry updated' : preset.leftover ? `${money(amount)} moved to savings` : `Logged ${money(amount)}`);

  });
}

      const repo = f.get('repo').trim();
      const token = f.get('token').trim();
      if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) return ['repo', 'Enter the repo as owner/name.'];
      if (!token) return ['token', 'Add your access token.'];
      cfg = { repo, token };
      localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
      sync();
    },
  });
}

function categorySheet(c) {
  openSheet({
    title: c ? 'Edit category' : 'Add category',
    focus: 'name',
    body: `<div class="rows form-rows"><label class="grow">${plainTile('i-tag')}<span>Name</span><input name="name" autocomplete="off" value="${esc(c?.name)}"></label></div>
      ${c ? `<button type="button" class="btn danger" data-act="archive-category" data-id="${esc(c.id)}">${svg('i-trash')}Remove category</button>` : ''}`,
    save(f) {
      const name = f.get('name').trim();
      if (!name) return ['name', 'Enter a name.'];
      if (c) Object.assign(c, { name, updatedAt: Date.now() });
      else data.categories.push({ id: uid(), name, updatedAt: Date.now() });
      commit();
    },
  });
}

/* Plan form saves as each field changes */

function setPlan(patch, payday, salaryAccountId = data.meta.salaryAccountId) {
  const now = Date.now();
  const today = localToday();
  data.meta = { ...data.meta, payday, setupDate: data.meta.setupDate ?? today, salaryAccountId, updatedAt: now };
  savePlan(data, patch, today, now);
}

function savePlanForm(form) {
  const f = new FormData(form);
  const salary = parseSen(f.get('salary'));
  const payday = Number(f.get('payday'));
  const auto = f.get('auto') === 'on';
  const pct = Number(f.get('pct'));
  const error = $('#plan-error');
  $('#pct-field').hidden = auto;
  form.querySelectorAll('[aria-invalid]').forEach(el => el.removeAttribute('aria-invalid'));
  const fail = (name, text) => { error.textContent = text; form.elements[name].setAttribute('aria-invalid', 'true'); };
  if (!f.get('salary') && !f.get('payday')) return;
  if (!(salary > 0)) return fail('salary', 'Enter your take-home salary, for example 6000.');
  if (!Number.isInteger(payday) || payday < 1 || payday > 31) return fail('payday', 'Enter a payday from 1 to 31.');
  if (!auto && !(pct >= 0 && pct <= 100)) return fail('pct', 'Enter a percentage from 0 to 100.');
  error.textContent = '';
  const first = !isSetup();
  setPlan({ salary, savePct: auto ? null : pct }, payday, f.get('salaryAccount') ?? data.meta.salaryAccountId);
  saved();
  if (first) render();
}

/* Actions */

const ACTIONS = {
  tab(el) { ui.tab = el.dataset.tab; ui.category = null; ui.cycleBack = 0; render(); scrollTo(0, 0); fillIn(); },
  add() { entrySheet(); },
  edit(el) { entrySheet(data.tx.find(t => t.id === el.dataset.id)); },
  account(el) { accountSheet(data.accounts.find(a => a.id === el.dataset.id), el.dataset.kind); },
  salary() { salarySheet(); },
  savings() { savingsSheet(); },
  commitments() { commitmentsSheet(); },
  commitment(el) { commitmentSheet(data.commitments.find(c => c.id === el.dataset.id)); },
  category(el) { categorySheet(data.categories.find(c => c.id === el.dataset.id)); },
  categories() { categoriesSheet(); },
  'sync-settings'() { syncSheet(); },
  cycle(el) { ui.cycleBack += Number(el.dataset.step); ui.category = null; render(); fillIn(true); },
  filter(el) { ui.category = ui.category === el.dataset.id ? null : el.dataset.id; render(); },
  'move-leftover'(el) { entrySheet(null, { type: 'transfer', amount: Number(el.dataset.amount), leftover: true }); },
  'dismiss-leftover'(el) { data.dismissed[el.dataset.id] = true; commit(); },
  'delete-entry'(el) {
    const t = data.tx.find(x => x.id === el.dataset.id);
    data.tx = data.tx.filter(x => x !== t);
    data.deleted[t.id] = Date.now();
    sheet.close();
    commit();
    toast('Entry deleted', () => {
      delete data.deleted[t.id];
      t.updatedAt = Date.now();
      data.tx.push(t);
      commit();
    });
  },
  archive(el) {
    const id = el.dataset.id;
    const a = data.accounts.find(x => x.id === id);
    const used = data.tx.some(t => t.accountId === id || t.toAccountId === id)
      || data.commitments.some(c => c.accountId === id) || data.meta.salaryAccountId === id;
    if (used) Object.assign(a, { archived: true, updatedAt: Date.now() });
    else { data.accounts = data.accounts.filter(x => x !== a); data.deleted[id] = Date.now(); }
    sheet.close();
    commit();
    toast(used ? 'Account archived. History kept.' : 'Account removed');
  },
  restore(el) {
    Object.assign(data.accounts.find(a => a.id === el.dataset.id), { archived: false, updatedAt: Date.now() });
    commit();
  },
  'end-commitment'(el) { endCommitment(data, el.dataset.id, localToday(), Date.now()); sheet.close(); commit(); },
  'archive-category'(el) {
    Object.assign(data.categories.find(c => c.id === el.dataset.id), { archived: true, updatedAt: Date.now() });
    sheet.close();
    commit();
  },
  disconnect() {
    cfg = { repo: cfg.repo };
    localStorage.setItem(SYNC_KEY, JSON.stringify(cfg));
    sheet.close();
    setSync('Token removed. Saved on this device only');
  },
};

document.addEventListener('click', e => {
  if (!e.target.closest('#toast')) hideToast();
  if (e.target.closest('[data-close]')) { sheet.close(); return; }
  if (e.target === sheet) { sheet.close(); return; }
  const el = e.target.closest('[data-act]');
  if (el) ACTIONS[el.dataset.act](el);
});

// Focus would otherwise fall to the page when the button that opened a sheet was redrawn.
sheet.addEventListener('close', () => {
  if (!sheetOpener?.isConnected) $('.tabs [aria-current="page"]')?.focus();
});

// iOS keeps fixed elements behind the keyboard, so lift the sheet above it.
function fitSheet() {
  const v = window.visualViewport;
  sheet.style.bottom = `${Math.max(0, innerHeight - v.height - v.offsetTop)}px`;
  sheet.style.maxHeight = `${v.height - 8}px`;
}
window.visualViewport?.addEventListener('resize', fitSheet);
window.visualViewport?.addEventListener('scroll', fitSheet);

document.addEventListener('change', e => {
  const form = e.target.closest('#plan-form');
  if (form) savePlanForm(form);
});

document.addEventListener('submit', e => {
  if (e.target.id === 'plan-form') e.preventDefault();
});

/* GitHub sync */

const b64 = s => btoa(unescape(encodeURIComponent(s)));
const unb64 = s => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const api = () => `https://api.github.com/repos/${cfg.repo}/contents/${DATA_FILE}`;
const headers = () => ({
  Authorization: `Bearer ${cfg.token}`,
  Accept: 'application/vnd.github+json',
  'X-GitHub-Api-Version': '2022-11-28',
});

function setSync(text) {
  syncText = text;
  const el = $('#sync-status');
  if (el) el.textContent = text;
}

async function pull() {
  // shortcut: the contents API returns file bodies only up to 1 MB, about 5,000 entries; move to the blobs API if reached.
  const r = await fetch(api(), { headers: headers(), cache: 'no-store' });
  if (r.status === 404) return { remote: {}, sha: null };
  if (!r.ok) throw new Error(`http${r.status}`);
  const j = await r.json();
  try {
    return { remote: JSON.parse(unb64(j.content)), sha: j.sha };
  } catch {
    // Never overwrite a remote file that could not be read.
    throw new Error('damaged');
  }
}

let busy = false;
let again = false;
let timer;

async function sync() {
  if (!cfg.token || !cfg.repo) return;
  if (busy) { again = true; return; }
  busy = true;
  setSync('Syncing');
  try {
    let done = false;
    for (let attempt = 0; attempt < 3 && !done; attempt++) {
      const { remote, sha } = await pull();
      data = merge(data, remote);
      persist();
      if (!typing()) render();
      const body = JSON.stringify(data);
      if (sha && JSON.stringify(merge(remote, {})) === body) { done = true; break; }
      const res = await fetch(api(), {
        method: 'PUT',
        headers: headers(),
        body: JSON.stringify({ message: 'Update finance data', content: b64(body), sha: sha ?? undefined }),
      });
      if (res.ok) done = true;
      else if (res.status !== 409 && res.status !== 422) throw new Error(`put${res.status}`);
    }
    setSync(done ? 'Synced to GitHub' : 'Sync conflict, will retry');
  } catch (e) {
    const code = String(e.message);
    setSync(/401|403/.test(code) ? 'GitHub rejected the token'
      : code === 'damaged' ? 'GitHub file is damaged, not overwritten'
      : code === 'put404' || code === 'http404' ? 'Repo not found, check the name and token'
      : 'Offline, saved on this device');
  }
  busy = false;
  if (again) { again = false; sync(); }
}

function queueSync() {
  if (!cfg.token || !cfg.repo) return;
  clearTimeout(timer);
  timer = setTimeout(sync, 1200);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { if (!typing()) render(); sync(); }
});

render();
fillIn();
sync();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
